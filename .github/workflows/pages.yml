# Deploy the site to GitHub Pages via Actions, replacing the legacy branch-build pipeline.
#
# Why: the legacy builder started failing ERRATICALLY after v1.16.0 — instant
# (duration 0) "Page build failed." with no further diagnostics, on pushes that
# changed nothing Pages should care about, while githubstatus reported all green.
# Four of the five builds after fbe58f7 failed that way; retriggers sometimes helped,
# then stopped helping. This path gives real logs, no shared build queue, and
# actions/configure-pages flips the site's build type to "workflow" on first run.
#
# The site is plain static files (there is a .nojekyll too) — upload everything as-is.
# Served at https://kicktro.com (custom domain; see the CNAME file in the repo root).
name: Deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Stage ONLY the site files. Uploading `path: .` tars the whole checkout — with the
      # generated ~1 MB pages committed on every change, the artifact ballooned and each
      # deploy took 8–10 minutes. The site needs just the two pages (the changelog link
      # points at github.com, not the Pages site); this keeps deploys under a minute.
      - name: Stage site
        run: |
          mkdir _site
          cp index.html dev-index.html _site/
          # CNAME must be IN THE ARTIFACT. With the Actions deploy the published site is only
          # what is staged here, so without this the custom domain (kicktro.com) is dropped on
          # the next deploy and Pages falls back to carlemil.github.io/kicktro.
          cp CNAME _site/
          # The built-in gallery scenes' thumbnails (poster .webp + hover clip .mp4), rendered
          # by tools/thumbs.js --builtin and referenced as thumbs/<slug>.* beside the page.
          if [ -d thumbs ]; then cp -r thumbs _site/; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
